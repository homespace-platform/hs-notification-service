services:
    hs-notification-service:
        image: ${NOTIFICATION_IMAGE:?}
        pull_policy: always
        restart: unless-stopped
        mem_limit: 512m
        environment:
            PORT: ${PORT:?}
            SERVICE_NAME: ${SERVICE_NAME:?}
            MONGODB_URI: ${MONGODB_URI:?}
            EUREKA_CLIENT_SERVICE_URL: ${EUREKA_CLIENT_SERVICE_URL:?}
            EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME:?}
            GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?}
            KAFKA_ENABLED: ${KAFKA_ENABLED:?}
            KAFKA_BROKERS: ${KAFKA_BROKERS:?}
            KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:?}
            KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:?}
            KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:?}
            KAFKA_DLT_TOPIC: ${KAFKA_DLT_TOPIC:?}
            KAFKA_RETRY_ATTEMPTS: ${KAFKA_RETRY_ATTEMPTS:?}
            KAFKA_RETRY_DELAY_MS: ${KAFKA_RETRY_DELAY_MS:?}
            KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:?}
            KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:?}
            NOTIFICATION_REALTIME_ORIGINS: ${NOTIFICATION_REALTIME_ORIGINS:?}
            PUSH_ENABLED: ${PUSH_ENABLED:?}
            FIREBASE_TYPE: ${FIREBASE_TYPE:?}
            FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
            FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID:?}
            FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?}
            FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?}
            FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID:?}
            FIREBASE_AUTH_URI: ${FIREBASE_AUTH_URI:?}
            FIREBASE_TOKEN_URI: ${FIREBASE_TOKEN_URI:?}
            FIREBASE_AUTH_PROVIDER_X509_CERT_URL: ${FIREBASE_AUTH_PROVIDER_X509_CERT_URL:?}
            FIREBASE_CLIENT_X509_CERT_URL: ${FIREBASE_CLIENT_X509_CERT_URL:?}
            FIREBASE_UNIVERSE_DOMAIN: ${FIREBASE_UNIVERSE_DOMAIN:?}
            MAIL_RESEND_API_KEY: ${MAIL_RESEND_API_KEY?}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:?}
            MAIL_APP_BASE_URL: ${MAIL_APP_BASE_URL:?}
            CORE_INTERNAL_BASE_URL: ${CORE_INTERNAL_BASE_URL:?}
            NODE_ENV: ${NODE_ENV:?}

networks:
    default:
        external: true
        name: hs-network
